<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Кошелёк — учёт расходов</title>
<style>
  :root {
    --emerald: #0f7a5a;
    --emerald-dark: #0a5c43;
    --teal: #17a2a2;
    --teal-light: #e6f6f5;
    --gray-bg: #f2f4f3;
    --gray-card: #ffffff;
    --gray-text: #2f3a37;
    --gray-muted: #7b8a86;
    --gray-line: #d8e0dd;
    --gold: #c9a227;
    --gold-light: #f5e9c6;
    --shadow: rgba(15, 122, 90, 0.12);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
    background: linear-gradient(160deg, var(--gray-bg) 0%, #e8eeec 100%);
    color: var(--gray-text);
    min-height: 100vh;
    padding: 1.5rem;
  }

  .app {
    max-width: 1000px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: 1fr 1.4fr;
    gap: 1.5rem;
  }

  @media (max-width: 820px) {
    .app { grid-template-columns: 1fr; }
  }

  /* ---------- Заголовок ---------- */
  .app-header {
    grid-column: 1 / -1;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 1rem;
    padding: 0.5rem 0;
  }

  .app-header h1 {
    font-size: 1.6rem;
    color: var(--emerald-dark);
    display: flex;
    align-items: center;
    gap: 0.6rem;
  }

  /* SVG-логотип кошелька */
  .logo-mark {
    width: 34px;
    height: 34px;
    flex-shrink: 0;
  }

  .app-header h1 span {
    background: linear-gradient(135deg, var(--emerald), var(--teal));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  .total-balance {
    background: linear-gradient(135deg, var(--emerald), var(--teal));
    color: #fff;
    padding: 0.6rem 1.4rem;
    border-radius: 12px;
    font-weight: 600;
    font-size: 1.1rem;
    box-shadow: 0 6px 18px var(--shadow);
    border: 1px solid var(--gold);
  }

  .total-balance small {
    display: block;
    font-size: 0.7rem;
    font-weight: 400;
    opacity: 0.85;
    letter-spacing: 0.5px;
    text-transform: uppercase;
  }

  /* ---------- Карточки ---------- */
  .card {
    background: var(--gray-card);
    border-radius: 16px;
    padding: 1.5rem;
    box-shadow: 0 8px 24px var(--shadow);
    border-top: 3px solid var(--gold);
  }

  .card h2 {
    font-size: 1.05rem;
    color: var(--emerald-dark);
    margin-bottom: 1rem;
    display: flex;
    align-items: center;
    gap: 0.5rem;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  .card h2 svg {
    width: 18px;
    height: 18px;
    flex-shrink: 0;
  }

  /* ---------- Форма ---------- */
  .form-group { margin-bottom: 0.9rem; }

  .form-group label {
    display: block;
    font-size: 0.8rem;
    color: var(--gray-muted);
    margin-bottom: 0.3rem;
    font-weight: 500;
  }

  input, select {
    width: 100%;
    padding: 0.65rem 0.8rem;
    border: 1.5px solid var(--gray-line);
    border-radius: 10px;
    font-size: 0.95rem;
    font-family: inherit;
    color: var(--gray-text);
    background: #fbfcfc;
    transition: border-color 0.2s, box-shadow 0.2s;
  }

  input:focus, select:focus {
    outline: none;
    border-color: var(--teal);
    box-shadow: 0 0 0 3px rgba(23, 162, 162, 0.15);
  }

  .btn-primary {
    width: 100%;
    padding: 0.75rem;
    background: linear-gradient(135deg, var(--emerald), var(--teal));
    color: #fff;
    border: none;
    border-radius: 10px;
    font-size: 1rem;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
    transition: transform 0.15s, box-shadow 0.2s;
    box-shadow: 0 4px 14px var(--shadow);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.5rem;
  }

  .btn-primary svg { width: 16px; height: 16px; }

  .btn-primary:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 20px rgba(15, 122, 90, 0.3);
  }

  .btn-primary:active { transform: translateY(0); }

  /* ---------- Фильтры ---------- */
  .filters {
    display: flex;
    gap: 0.5rem;
    margin-bottom: 1rem;
    flex-wrap: wrap;
  }

  .filter-btn {
    padding: 0.4rem 0.9rem;
    border-radius: 20px;
    border: 1.5px solid var(--gray-line);
    background: transparent;
    color: var(--gray-muted);
    font-size: 0.8rem;
    font-family: inherit;
    cursor: pointer;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    gap: 0.35rem;
  }

  .filter-btn svg { width: 13px; height: 13px; }

  .filter-btn.active {
    background: var(--teal-light);
    border-color: var(--teal);
    color: var(--emerald-dark);
    font-weight: 600;
  }

  /* ---------- Список ---------- */
  .expense-list {
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: 0.6rem;
    max-height: 400px;
    overflow-y: auto;
    padding-right: 4px;
  }

  .expense-list::-webkit-scrollbar { width: 6px; }
  .expense-list::-webkit-scrollbar-thumb {
    background: #cdd8d4;
    border-radius: 3px;
  }

  .expense-item {
    display: flex;
    align-items: center;
    gap: 0.8rem;
    padding: 0.7rem 0.9rem;
    background: #fafcfb;
    border-radius: 12px;
    border-left: 4px solid var(--teal);
    transition: background 0.2s, transform 0.15s;
    animation: slideIn 0.25s ease;
  }

  @keyframes slideIn {
    from { opacity: 0; transform: translateX(-8px); }
    to { opacity: 1; transform: translateX(0); }
  }

  .expense-item:hover {
    background: var(--teal-light);
    transform: translateX(3px);
  }

  /* Круглая иконка категории */
  .cat-icon {
    width: 38px;
    height: 38px;
    border-radius: 50%;
    background: var(--teal-light);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    border: 1px solid rgba(23, 162, 162, 0.3);
  }

  .cat-icon svg { width: 18px; height: 18px; }

  .expense-info { flex: 1; min-width: 0; }

  .expense-title {
    font-weight: 600;
    font-size: 0.92rem;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .expense-meta {
    font-size: 0.75rem;
    color: var(--gray-muted);
  }

  .expense-amount {
    font-weight: 700;
    color: var(--emerald-dark);
    font-size: 1rem;
    white-space: nowrap;
  }

  .delete-btn {
    background: none;
    border: none;
    color: #b9c4c0;
    cursor: pointer;
    padding: 0.3rem;
    border-radius: 6px;
    transition: color 0.2s, background 0.2s;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .delete-btn svg { width: 14px; height: 14px; }

  .delete-btn:hover {
    color: #c0392b;
    background: #fdecea;
  }

  /* Пустое состояние */
  .empty-state {
    text-align: center;
    padding: 2rem 1rem;
    color: var(--gray-muted);
    font-size: 0.9rem;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.6rem;
  }

  .empty-state svg {
    width: 40px;
    height: 40px;
    opacity: 0.5;
  }

  /* ---------- Статистика ---------- */
  .stats {
    margin-top: 1rem;
    padding-top: 1rem;
    border-top: 1px dashed var(--gray-line);
    font-size: 0.85rem;
    color: var(--gray-muted);
    display: flex;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 0.5rem;
  }

  .stats strong { color: var(--gold); }

  /* ---------- Диаграмма ---------- */
  .cat-bars {
    margin-top: 1.2rem;
    display: flex;
    flex-direction: column;
    gap: 0.6rem;
  }

  .cat-bar-row {
    display: flex;
    align-items: center;
    gap: 0.6rem;
    font-size: 0.8rem;
  }

  .cat-bar-label {
    width: 120px;
    flex-shrink: 0;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    display: flex;
    align-items: center;
    gap: 0.3rem;
  }

  .cat-bar-label svg { width: 12px; height: 12px; flex-shrink: 0; }

  .cat-bar-track {
    flex: 1;
    height: 10px;
    background: #e8eeec;
    border-radius: 5px;
    overflow: hidden;
  }

  .cat-bar-fill {
    height: 100%;
    border-radius: 5px;
    background: linear-gradient(90deg, var(--teal), var(--emerald));
    transition: width 0.4s ease;
  }

  .cat-bar-value {
    width: 85px;
    text-align: right;
    color: var(--gray-muted);
    flex-shrink: 0;
  }
</style>
</head>

<body>

<div class="app">

  <header class="app-header">
    <h1>
      <!-- SVG-иконка кошелька -->
      <svg class="logo-mark" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect x="2" y="6" width="20" height="14" rx="3" fill="url(#g1)" stroke="#0a5c43" stroke-width="1.2"/>
        <path d="M2 10h20" stroke="#0a5c43" stroke-width="1.2"/>
        <circle cx="17" cy="15" r="1.6" fill="#c9a227" stroke="#0a5c43" stroke-width="1"/>
        <defs>
          <linearGradient id="g1" x1="2" y1="6" x2="22" y2="20">
            <stop offset="0" stop-color="#0f7a5a"/>
            <stop offset="1" stop-color="#17a2a2"/>
          </linearGradient>
        </defs>
      </svg>
      <span>Кошелёк</span>
    </h1>
    <div class="total-balance">
      <small>Всего потрачено</small>
      <span id="totalSum">0 ₽</span>
    </div>
  </header>

  <!-- Левая колонка -->
  <section class="card">
    <h2>
      <svg viewBox="0 0 24 24" fill="none" stroke="#0f7a5a" stroke-width="2.2" stroke-linecap="round">
        <line x1="12" y1="5" x2="12" y2="19"/>
        <line x1="5" y1="12" x2="19" y2="12"/>
      </svg>
      Новый расход
    </h2>
    <form id="expenseForm">
      <div class="form-group">
        <label for="title">Название</label>
        <input type="text" id="title" placeholder="Например: Кофе" required maxlength="40">
      </div>
      <div class="form-group">
        <label for="amount">Сумма (₽)</label>
        <input type="number" id="amount" placeholder="0" min="0.01" step="0.01" required>
      </div>
      <div class="form-group">
        <label for="category">Категория</label>
        <select id="category">
          <option value="food">Еда</option>
          <option value="transport">Транспорт</option>
          <option value="home">Дом</option>
          <option value="fun">Развлечения</option>
          <option value="health">Здоровье</option>
          <option value="shopping">Покупки</option>
          <option value="other">Другое</option>
        </select>
      </div>
      <button type="submit" class="btn-primary">
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round">
          <line x1="12" y1="5" x2="12" y2="19"/>
          <line x1="5" y1="12" x2="19" y2="12"/>
        </svg>
        Добавить расход
      </button>
    </form>
  </section>

  <!-- Правая колонка -->
  <section class="card">
    <h2>
      <svg viewBox="0 0 24 24" fill="none" stroke="#0f7a5a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="8" y1="6" x2="21" y2="6"/>
        <line x1="8" y1="12" x2="21" y2="12"/>
        <line x1="8" y1="18" x2="21" y2="18"/>
        <circle cx="3.5" cy="6" r="1.2" fill="#c9a227" stroke="none"/>
        <circle cx="3.5" cy="12" r="1.2" fill="#c9a227" stroke="none"/>
        <circle cx="3.5" cy="18" r="1.2" fill="#c9a227" stroke="none"/>
      </svg>
      Мои расходы
    </h2>

    <div class="filters" id="filters"></div>

    <ul class="expense-list" id="expenseList"></ul>

    <div class="stats">
      <span>Записей: <strong id="countStat">0</strong></span>
      <span>Средний расход: <strong id="avgStat">0 ₽</strong></span>
    </div>

    <div class="cat-bars" id="catBars"></div>
  </section>

</div>

<script>
  // ---------- Категории с SVG-иконками ----------
  const ICONS = {
    food: `<svg viewBox="0 0 24 24" fill="none" stroke="#0f7a5a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4 3v7a3 3 0 0 0 6 0V3"/>
      <path d="M7 3v18"/>
      <path d="M17 3c-1.5 0-3 1.5-3 4v4h3v10"/>
    </svg>`,
    transport: `<svg viewBox="0 0 24 24" fill="none" stroke="#0f7a5a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="5" width="18" height="12" rx="2"/>
      <path d="M3 11h18"/>
      <circle cx="7" cy="19" r="1.6"/>
      <circle cx="17" cy="19" r="1.6"/>
    </svg>`,
    home: `<svg viewBox="0 0 24 24" fill="none" stroke="#0f7a5a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3 11l9-7 9 7"/>
      <path d="M5 10v10h14V10"/>
      <path d="M10 20v-6h4v6"/>
    </svg>`,
    fun: `<svg viewBox="0 0 24 24" fill="none" stroke="#0f7a5a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="2" y="7" width="20" height="10" rx="5"/>
      <line x1="7" y1="12" x2="7" y2="12.01"/>
      <line x1="17" y1="10" x2="17" y2="10.01"/>
      <line x1="17" y1="14" x2="17" y2="14.01"/>
      <line x1="4" y1="12" x2="4" y2="12.01"/>
    </svg>`,
    health: `<svg viewBox="0 0 24 24" fill="none" stroke="#0f7a5a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 21s-7-4.5-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 11c0 5.5-7 10-7 10z"/>
      <path d="M8 12h2l1-2 2 4 1-2h2"/>
    </svg>`,
    shopping: `<svg viewBox="0 0 24 24" fill="none" stroke="#0f7a5a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M6 7h12l-1 13H7L6 7z"/>
      <path d="M9 7a3 3 0 0 1 6 0"/>
    </svg>`,
    other: `<svg viewBox="0 0 24 24" fill="none" stroke="#0f7a5a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="9"/>
      <circle cx="8" cy="12" r="1" fill="#0f7a5a" stroke="none"/>
      <circle cx="12" cy="12" r="1" fill="#0f7a5a" stroke="none"/>
      <circle cx="16" cy="12" r="1" fill="#0f7a5a" stroke="none"/>
    </svg>`,
  };

  const CATEGORIES = {
    food:      { name: 'Еда' },
    transport: { name: 'Транспорт' },
    home:      { name: 'Дом' },
    fun:       { name: 'Развлечения' },
    health:    { name: 'Здоровье' },
    shopping:  { name: 'Покупки' },
    other:     { name: 'Другое' },
  };

  const STORAGE_KEY = 'wallet_expenses_v1';
  let expenses = loadExpenses();
  let currentFilter = 'all';

  // ---------- DOM ----------
  const form = document.getElementById('expenseForm');
  const listEl = document.getElementById('expenseList');
  const totalSumEl = document.getElementById('totalSum');
  const countStatEl = document.getElementById('countStat');
  const avgStatEl = document.getElementById('avgStat');
  const catBarsEl = document.getElementById('catBars');
  const filtersEl = document.getElementById('filters');

  // ---------- Хранилище ----------
  function loadExpenses() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      return raw ? JSON.parse(raw) : [];
    } catch { return []; }
  }

  function saveExpenses() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(expenses));
  }

  // ---------- Утилиты ----------
  const fmt = (n) => n.toLocaleString('ru-RU', { maximumFractionDigits: 2 }) + ' ₽';

  function formatDate(ts) {
    const d = new Date(ts);
    return d.toLocaleDateString('ru-RU', { day: '2-digit', month: 'short' })
      + ', ' + d.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  // ---------- Форма ----------
  form.addEventListener('submit', (e) => {
    e.preventDefault();
    const title = document.getElementById('title').value.trim();
    const amount = parseFloat(document.getElementById('amount').value);
    const category = document.getElementById('category').value;
    if (!title || !(amount > 0)) return;

    expenses.unshift({
      id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
      title, amount, category, date: Date.now(),
    });

    saveExpenses();
    form.reset();
    document.getElementById('title').focus();
    render();
  });

  // ---------- Удаление ----------
  function deleteExpense(id) {
    expenses = expenses.filter(e => e.id !== id);
    saveExpenses();
    render();
  }

  // ---------- Фильтры ----------
  function renderFilters() {
    const items = [{ key: 'all', name: 'Все' }, ...Object.entries(CATEGORIES).map(([k, v]) => ({ key: k, name: v.name }))];
    filtersEl.innerHTML = items.map(it => {
      const icon = it.key === 'all'
        ? `<svg viewBox="0 0 24 24" fill="none" stroke="#0f7a5a" stroke-width="2.2" stroke-linecap="round">
             <line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="17" x2="20" y2="17"/>
           </svg>`
        : ICONS[it.key];
      return `<button class="filter-btn ${currentFilter === it.key ? 'active' : ''}" data-filter="${it.key}">${icon}${it.name}</button>`;
    }).join('');
  }

  filtersEl.addEventListener('click', (e) => {
    const btn = e.target.closest('.filter-btn');
    if (!btn) return;
    currentFilter = btn.dataset.filter;
    render();
  });

  // ---------- Рендер ----------
  function render() {
    renderFilters();
    renderList();
    renderTotal();
    renderStats();
    renderCategoryBars();
  }

  function renderList() {
    const visible = currentFilter === 'all'
      ? expenses
      : expenses.filter(e => e.category === currentFilter);

    if (visible.length === 0) {
      listEl.innerHTML = `
        <li class="empty-state">
          <svg viewBox="0 0 24 24" fill="none" stroke="#7b8a86" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <ellipse cx="12" cy="7" rx="8" ry="3"/>
            <path d="M4 7v5c0 1.7 3.6 3 8 3s8-1.3 8-3V7"/>
            <path d="M4 12v5c0 1.7 3.6 3 8 3s8-1.3 8-3v-5"/>
          </svg>
          ${currentFilter === 'all' ? 'Пока нет расходов. Добавь первый.' : 'В этой категории пусто.'}
        </li>`;
      return;
    }

    listEl.innerHTML = visible.map(e => {
      const cat = CATEGORIES[e.category] || CATEGORIES.other;
      const icon = ICONS[e.category] || ICONS.other;
      return `
        <li class="expense-item">
          <div class="cat-icon">${icon}</div>
          <div class="expense-info">
            <div class="expense-title">${escapeHtml(e.title)}</div>
            <div class="expense-meta">${cat.name} · ${formatDate(e.date)}</div>
          </div>
          <div class="expense-amount">${fmt(e.amount)}</div>
          <button class="delete-btn" data-id="${e.id}" title="Удалить">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round">
              <line x1="6" y1="6" x2="18" y2="18"/>
              <line x1="18" y1="6" x2="6" y2="18"/>
            </svg>
          </button>
        </li>`;
    }).join('');

    listEl.querySelectorAll('.delete-btn').forEach(btn => {
      btn.addEventListener('click', () => deleteExpense(btn.dataset.id));
    });
  }

  function renderTotal() {
    const total = expenses.reduce((s, e) => s + e.amount, 0);
    totalSumEl.textContent = fmt(total);
  }

  function renderStats() {
    countStatEl.textContent = expenses.length;
    const total = expenses.reduce((s, e) => s + e.amount, 0);
    avgStatEl.textContent = expenses.length ? fmt(total / expenses.length) : '0 ₽';
  }

  function renderCategoryBars() {
    const byCat = {};
    expenses.forEach(e => { byCat[e.category] = (byCat[e.category] || 0) + e.amount; });
    const entries = Object.entries(byCat).sort((a, b) => b[1] - a[1]);
    if (entries.length === 0) { catBarsEl.innerHTML = ''; return; }
    const max = entries[0][1];
    catBarsEl.innerHTML = entries.map(([cat, sum]) => {
      const c = CATEGORIES[cat] || CATEGORIES.other;
      const width = Math.max(4, (sum / max) * 100);
      return `
        <div class="cat-bar-row">
          <div class="cat-bar-label">${ICONS[cat] || ICONS.other}${c.name}</div>
          <div class="cat-bar-track"><div class="cat-bar-fill" style="width:${width}%"></div></div>
          <div class="cat-bar-value">${fmt(sum)}</div>
        </div>`;
    }).join('');
  }

  // ---------- Старт ----------
  render();
</script>
</body>
</html>
