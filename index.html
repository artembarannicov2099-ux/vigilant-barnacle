<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Regod v1.0</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;user-select:none;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:#1d1f23;color:#e0e0e0;font-family:system-ui,sans-serif;touch-action:none;font-size:14px}
.screen{position:fixed;inset:0;display:none;flex-direction:column;z-index:10;background:#1d1f23}
.screen.show{display:flex}
.btn{background:#3a3f47;color:#e0e0e0;border:1px solid #4a4f58;border-radius:4px;padding:8px 14px;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap;flex-shrink:0;min-height:36px}
.btn:active{background:#4a4f58}
.btn.primary{background:#478cbf;border-color:#5a9fd4;color:#fff}
.btn.danger{background:#bf4747;border-color:#d45a5a;color:#fff}
.btn.success{background:#478c47;border-color:#5ad45a;color:#fff}
.btn.small{padding:5px 10px;font-size:11px;min-height:28px}
#menu{background:#1d1f23;align-items:center;justify-content:center;gap:20px}
#menu .logo{font-size:52px;font-weight:700;color:#478cbf;letter-spacing:2px}
#menu .logo span{color:#e0e0e0}
#menu .sub{color:#8b8f96;font-size:13px;margin-top:-8px;margin-bottom:24px}
#menu .menu-panel{background:#26292e;border:1px solid #3a3f47;border-radius:6px;padding:20px;width:100%;max-width:480px}
#menu .menu-title{color:#8b8f96;font-size:12px;text-transform:uppercase;letter-spacing:1px;margin-bottom:12px;font-weight:600}
#projectList{display:flex;flex-direction:column;gap:8px;margin-bottom:16px;max-height:40vh;overflow-y:auto}
.project-item{background:#2d3138;border:1px solid #3a3f47;border-radius:4px;padding:12px;cursor:pointer}
.project-item:hover{background:#34383f;border-color:#478cbf}
.project-item .pname{color:#e0e0e0;font-weight:600;font-size:15px}
.project-item .pinfo{color:#8b8f96;font-size:12px;margin-top:4px}
.menu-buttons{display:flex;flex-direction:column;gap:8px}
#editor{flex-direction:column;background:#1d1f23}
#topbar{display:flex;align-items:center;gap:6px;padding:6px 10px;background:#26292e;border-bottom:1px solid #3a3f47;flex-shrink:0;overflow-x:auto}
#logo{font-weight:700;color:#478cbf;font-size:15px;letter-spacing:1px;white-space:nowrap}
#logo span{color:#e0e0e0}
#scene-tabs{display:flex;gap:2px;padding:4px 8px;background:#1d1f23;border-bottom:1px solid #3a3f47;overflow-x:auto;flex-shrink:0}
.scene-tab{padding:7px 12px;background:#26292e;border:1px solid #3a3f47;border-radius:3px 3px 0 0;font-size:12px;cursor:pointer;white-space:nowrap;display:flex;gap:5px;align-items:center;min-height:32px;color:#b0b4ba}
.scene-tab.active{background:#478cbf;border-color:#5a9fd4;color:#fff}
.scene-tab .x{color:#ff8888;font-weight:700;margin-left:4px;font-size:14px}
#main{flex:1;display:flex;overflow:hidden;min-height:0}
#hier{width:150px;background:#26292e;border-right:1px solid #3a3f47;overflow-y:auto;padding:6px;flex-shrink:0}
.h-title{font-size:11px;color:#8b8f96;text-transform:uppercase;padding:6px 6px 4px;font-weight:600;display:flex;justify-content:space-between;align-items:center;letter-spacing:0.5px}
.h-item{padding:8px;font-size:12px;border-radius:3px;margin-bottom:1px;background:#2d3138;cursor:pointer;display:flex;gap:5px;align-items:center;white-space:nowrap;overflow:hidden;min-height:34px;color:#c0c4ca}
.h-item.sel{background:#478cbf33;outline:1px solid #478cbf;color:#fff}
.h-item.child{margin-left:10px;border-left:2px solid #3a3f47;padding-left:6px;font-size:11px}
.h-item .tag{font-size:10px;color:#5ad45a}
.h-item .tag-script{font-size:10px;color:#e3b341}
#view{flex:1;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden;background:#1d1f23;min-width:0;min-height:0}
#scene-canvas{background:#0d0f12;border:1px solid #3a3f47;max-width:100%;max-height:100%;touch-action:none;display:block}
#mode-label{position:absolute;top:8px;left:10px;font-size:11px;background:#26292ecc;padding:4px 10px;border-radius:12px;color:#8b8f96;pointer-events:none}
#insp{width:160px;background:#26292e;border-left:1px solid #3a3f47;overflow-y:auto;padding:8px;flex-shrink:0;font-size:12px}
.prop{margin-bottom:8px}
.prop label{display:block;font-size:11px;color:#8b8f96;margin-bottom:3px}
.prop input,.prop select,.prop textarea{width:100%;background:#1d1f23;border:1px solid #3a3f47;border-radius:3px;color:#e0e0e0;padding:6px 8px;font-size:12px;outline:none;font-family:inherit;min-height:32px}
.prop input:focus,.prop select:focus,.prop textarea:focus{border-color:#478cbf}
.prop input[type=checkbox]{width:auto;min-height:auto;height:20px}
.prop .row2{display:flex;gap:4px;margin-top:3px}
#toolbar{display:flex;gap:4px;padding:6px;background:#26292e;border-top:1px solid #3a3f47;overflow-x:auto;flex-shrink:0}
#toolbar .btn{font-size:11px;padding:6px 8px;min-height:32px}
#modal{position:fixed;inset:0;background:#000c;display:none;align-items:center;justify-content:center;z-index:99;padding:12px}
#modal.show{display:flex}
#modal-box{background:#26292e;border:1px solid #3a3f47;border-radius:6px;padding:16px;width:100%;max-width:560px;max-height:92vh;overflow-y:auto}
#modal-box h3{font-size:15px;color:#478cbf;margin-bottom:10px}
#modal-box .hint{font-size:11px;color:#8b8f96;background:#1d1f23;border:1px solid #3a3f47;border-radius:3px;padding:8px;margin-bottom:10px;line-height:1.5}
#modal-box textarea{width:100%;height:220px;background:#1d1f23;border:1px solid #3a3f47;border-radius:3px;color:#e0e0e0;font-family:monospace;font-size:12px;padding:8px;outline:none;resize:vertical;line-height:1.4}
#modal-row{display:flex;gap:6px;justify-content:flex-end;margin-top:12px;flex-wrap:wrap}
#game-screen{position:fixed;inset:0;display:none;background:#000;z-index:5}
#game-screen.show{display:block}
#game-view{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#000;overflow:hidden}
#game-canvas{background:#0d0f12;touch-action:none;display:block}
</style>
</head>

<script>
/* ============================================================
   REGOD ENGINE v1.0 — VehicleBody2D, WheelBody2D, Camera2D,
   бесконечная карта
   ============================================================ */
const W = 400, H = 400;
const WORLD_TILE = 400; // размер чанка бесконечной карты
const DEFAULT_INPUT_MAP = {
  move_left:  ['ArrowLeft','KeyA'],
  move_right: ['ArrowRight','KeyD'],
  move_up:    ['ArrowUp','KeyW'],
  move_down:  ['ArrowDown','KeyS'],
  jump:       ['Space'],
  fly:        ['KeyF'],
  action:     ['Enter','KeyE'],
  car_left:   ['ArrowLeft'],
  car_right:  ['ArrowRight'],
  car_gas:    ['ArrowUp'],
  car_brake:  ['ArrowDown']
};
const FONTS = ['system-ui','monospace','serif','sans-serif','cursive','fantasy'];

const NODE_TYPES = {
  platform:      { w:100, h:16, color:'#3a3f47', solid:true,  dynamic:false, icon:'🧱' },
  player:        { w:26,  h:36, color:'#5ad45a', solid:true,  dynamic:true,  icon:'🎮' },
  box:           { w:15,  h:15, color:'#8b8f96', solid:true,  dynamic:false, icon:'⬛' },
  circle:        { w:28,  h:28, r:14, color:'#d48c47', solid:true, dynamic:false, icon:'⚪' },
  enemy:         { w:32,  h:32, color:'#d45a5a', solid:true,  dynamic:true,  icon:'👾' },
  coin:          { w:24,  h:24, r:12, color:'#e3b341', solid:false, dynamic:false, icon:'🪙' },
  button:        { w:120, h:44, color:'#478cbf', solid:false, dynamic:false, icon:'🔘', ui:true },
  label:         { w:120, h:24, color:'#c0c4ca', solid:false, dynamic:false, icon:'📝', ui:true },
  canvaslayer:   { w:W,   h:H,  color:'#000000', solid:false, dynamic:false, icon:'🖼', layer:1 },
  sprite:        { w:W,   h:H,  color:'#000000', solid:false, dynamic:false, icon:'🌄', layer:-1 },
  camera2d:      { w:20,  h:20, color:'#478cbf', solid:false, dynamic:false, icon:'📷' },
  vehiclebody2d: { w:80,  h:40, color:'#5a6b7c', solid:true,  dynamic:true,  icon:'🚗' },
  wheelbody2d:   { w:20,  h:20, r:10, color:'#2d3138', solid:false, dynamic:false, icon:'⚙' },
  infinitemap:   { w:W,   h:H,  color:'#000000', solid:false, dynamic:false, icon:'🗺', layer:-10 },
  toggle:        { w:60,  h:30, color:'#478c47', solid:false, dynamic:false, icon:'🔄', ui:true },
  slider:        { w:140, h:20, color:'#478cbf', solid:false, dynamic:false, icon:'🎚', ui:true }
};

class Node {
  constructor(type, id){
    this.type = type; this.id = id;
    const def = NODE_TYPES[type] || { w:32, h:32, color:'#888' };
    this.w = def.w; this.h = def.h;
    this.r = def.r || (this.w / 2);
    this.color = def.color;
    this.solid = def.solid !== undefined ? def.solid : true;
    this.dynamic = def.dynamic || false;
    this.layerOrder = def.layer || 0;
    this.x = 200; this.y = 100;
    this.vx = 0; this.vy = 0; this.onGround = false;
    this.angle = 0; this.angularVel = 0;
    this.parentId = null; this.children = [];
    this.texture = null; this.visible = true;
    this.speed = 220; this.jumpForce = 420; this.canFly = false;
    this.text = 'Кнопка'; this.fontSize = 14; this.fontFamily = 'system-ui';
    this.textColor = '#fff'; this.bgColor = def.color || '#478cbf';
    this.bgTransparent = false; this.action = '';
    this.onUpdate = ''; this.onPress = ''; this.onRelease = ''; this.onStart = '';
    this.data = {};
    this.value = 0;
    // vehicle
    this.engineForce = 300; this.turnSpeed = 2;
    // wheel
    this.radius = 10; this.steerable = false;
    // camera
    this.followId = ''; this.zoom = 1; this.smooth = 0.1;
    // infinite map
    this.tileColor = '#0d0f12'; this.gridColor = '#1a1d21';
  }
  get left(){return this.x-this.w/2} get right(){return this.x+this.w/2}
  get top(){return this.y-this.h/2} get bottom(){return this.y+this.h/2}
  isRound(){return this.type==='circle'||this.type==='coin'||this.type==='wheelbody2d'||this.type==='health'||this.type==='key'||this.type==='powerup'}
  isUI(){const t=this.type;return t==='button'||t==='label'||t==='toggle'||t==='slider'||t==='canvaslayer'}
  isBackground(){return this.type==='sprite'||this.type==='infinitemap'}
  isVehicle(){return this.type==='vehiclebody2d'}
  isWheel(){return this.type==='wheelbody2d'}
  isCamera(){return this.type==='camera2d'}
}

class Scene {
  constructor(name){
    this.name = name; this.nodes = []; this.nid = 1; this.roots = [];
    this.onStart = ''; this.onUpdate = '';
    this.bgColor = '#0d0f12';
    this.infinite = false; // бесконечная карта
  }
  add(type, x, y, parentId=null){
    const n = new Node(type, 'n'+this.nid++);
    n.x = x; n.y = y; n.parentId = parentId;
    this.nodes.push(n);
    if(parentId){
      const p = this.find(parentId);
      if(p) p.children.push(n.id);
    } else this.roots.push(n.id);
    return n;
  }
  find(id){ return this.nodes.find(n=>n.id===id); }
  get player(){ return this.nodes.find(n=>n.type==='player' && n.visible); }
  get camera(){ return this.nodes.find(n=>n.type==='camera2d' && n.visible); }
  remove(id){
    const n = this.find(id); if(!n) return;
    for(const cid of [...n.children]) this.remove(cid);
    this.nodes = this.nodes.filter(x=>x.id!==id);
    if(n.parentId){
      const p = this.find(n.parentId);
      if(p) p.children = p.children.filter(c=>c!==id);
    } else this.roots = this.roots.filter(c=>c!==id);
  }
  clear(){ this.nodes=[]; this.roots=[]; this.nid=1; }
}

const engine = {
  scenes: [], currentScene: 0, selected: null,
  mode: 'edit', keys: {},
  inputMap: JSON.parse(JSON.stringify(DEFAULT_INPUT_MAP)),
  drag: null, lastT: 0, gameRaf: null,
  settings: { gravity:900, grid:true },
  canvas: null, ctx: null, gameCanvas: null, gameCtx: null,
  gameState: null, touchActions: {}, touchX: null, buttonHeld: new Set(),
  camera: { x:0, y:0, zoom:1 },

  init(){
    this.canvas = document.getElementById('scene-canvas');
    this.ctx = this.canvas.getContext('2d');
    this.gameCanvas = document.getElementById('game-canvas');
    this.gameCtx = this.gameCanvas.getContext('2d');
    this.bindInput();
    this.startRender();
    this.refreshSceneTabs();
    this.refreshHier();
    this.draw();
  },

  cloneScene(scene){
    const sc = new Scene(scene.name);
    sc.nid = scene.nid;
    sc.onStart = scene.onStart;
    sc.onUpdate = scene.onUpdate;
    sc.bgColor = scene.bgColor;
    sc.infinite = scene.infinite;
    sc.roots = [...scene.roots];
    sc.nodes = scene.nodes.map(nd => {
      const n = new Node(nd.type, nd.id);
      Object.assign(n, nd);
      n.children = [...nd.children];
      n.data = JSON.parse(JSON.stringify(nd.data || {}));
      n._img = null;
      return n;
    });
    return sc;
  },

  toWorld(cx, cy, canvas, scene){
    const c = canvas || this.canvas;
    const r = c.getBoundingClientRect();
    let wx = (cx-r.left)/r.width*W;
    let wy = (cy-r.top)/r.height*H;
    // учёт камеры
    const cam = this.camera;
    if(scene && scene.infinite){
      wx = wx + cam.x;
      wy = wy + cam.y;
    }
    return { x:wx, y:wy };
  },
  hitTest(px, py){
    const sorted = [...this.scene.nodes].sort((a,b)=>(b.layerOrder||0)-(a.layerOrder||0));
    for(const n of sorted){
      if(!n.visible || n.isBackground() || n.isCamera()) continue;
      if(n.isRound()){
        if(Math.hypot(px-n.x, py-n.y) <= n.r+4) return n;
      } else {
        if(px>=n.left-4 && px<=n.right+4 && py>=n.top-4 && py<=n.bottom+4) return n;
      }
    }
    return null;
  },

  bindInput(){
    const c = this.canvas;
    const startEdit = (cx, cy)=>{
      if(this.mode!=='edit') return;
      const p = this.toWorld(cx, cy, c, null);
      const hit = this.hitTest(p.x, p.y);
      if(hit){
        this.select(hit.id);
        this.drag = { node:hit, ox:hit.x-p.x, oy:hit.y-p.y };
      } else this.select(null);
    };
    const moveEdit = (cx, cy)=>{
      if(this.mode!=='edit' || !this.drag) return;
      const p = this.toWorld(cx, cy, c, null);
      this.drag.node.x = Math.round(p.x + this.drag.ox);
      this.drag.node.y = Math.round(p.y + this.drag.oy);
      this.fillInspector(); this.draw();
    };
    const endEdit = ()=>{ this.drag = null; };

    c.addEventListener('touchstart', e=>{ e.preventDefault(); const t=e.touches[0]; startEdit(t.clientX,t.clientY); }, {passive:false});
    c.addEventListener('touchmove',  e=>{ e.preventDefault(); const t=e.touches[0]; moveEdit(t.clientX,t.clientY); }, {passive:false});
    c.addEventListener('touchend',   e=>{ e.preventDefault(); endEdit(); }, {passive:false});
    c.addEventListener('mousedown',  e=>{ startEdit(e.clientX,e.clientY); });
    c.addEventListener('mousemove',  e=>{ moveEdit(e.clientX,e.clientY); });
    c.addEventListener('mouseup',    e=>{ endEdit(); });
    c.addEventListener('contextmenu', e=>e.preventDefault());

    window.addEventListener('keydown', e=>{
      this.keys[e.code]=true;
      if(this.mode==='play') e.preventDefault();
    });
    window.addEventListener('keyup', e=>{ this.keys[e.code]=false; });
  },

  isActionPressed(action){
    const codes = this.inputMap[action] || [];
    return codes.some(c=>this.keys[c]);
  },

  refreshSceneTabs(){
    const tabs = document.getElementById('scene-tabs');
    tabs.innerHTML = '';
    this.scenes.forEach((s, i)=>{
      const el = document.createElement('div');
      el.className = 'scene-tab' + (i===this.currentScene?' active':'');
      el.innerHTML = `${s.name}${this.scenes.length>1?' <span class="x">✕</span>':''}`;
      el.onclick = (e)=>{
        if(e.target.classList.contains('x')){ e.stopPropagation(); this.deleteScene(i); }
        else this.switchScene(i);
      };
      tabs.appendChild(el);
    });
    const add = document.createElement('div');
    add.className = 'scene-tab';
    add.style.background = '#478c47'; add.style.color = '#fff';
    add.textContent = '+ Сцена';
    add.onclick = ()=>{
      const name = prompt('Имя сцены:', 'Сцена ' + (this.scenes.length+1));
      if(name) this.createScene(name);
    };
    tabs.appendChild(add);
  },
  createScene(name){
    this.scenes.push(new Scene(name));
    this.currentScene = this.scenes.length-1;
    this.selected = null;
    this.refreshSceneTabs(); this.refreshHier(); this.fillInspector(); this.draw();
  },
  deleteScene(idx){
    if(this.scenes.length <= 1){ alert('Нельзя удалить последнюю'); return; }
    if(!confirm('Удалить сцену "'+this.scenes[idx].name+'"?')) return;
    this.scenes.splice(idx, 1);
    if(this.currentScene >= this.scenes.length) this.currentScene = this.scenes.length-1;
    this.selected = null;
    this.refreshSceneTabs(); this.refreshHier(); this.fillInspector(); this.draw();
  },
  switchScene(idx){
    this.currentScene = idx;
    this.selected = null;
    this.refreshSceneTabs(); this.refreshHier(); this.fillInspector(); this.draw();
  },
  get scene(){ return this.scenes[this.currentScene]; },

  select(id){ this.selected = id; this.refreshHier(); this.fillInspector(); this.draw(); },
  refreshHier(){
    const list = document.getElementById('hlist');
    list.innerHTML = '';
    const renderNode = (id, depth)=>{
      const n = this.scene.find(id); if(!n) return;
      const el = document.createElement('div');
      el.className = 'h-item' + (n.id===this.selected?' sel':'') + (depth>0?' child':'');
      const def = NODE_TYPES[n.type] || { icon:'?' };
      const hasScript = (n.onUpdate||n.onPress||n.onRelease||n.onStart) ? '<span class="tag-script">⚡</span>' : '';
      const childTag = n.children.length>0 ? '<span style="color:#8b8f96">▸</span>' : '';
      const playTag = n.type==='player' ? '<span class="tag">P</span>' : (n.type==='camera2d' ? '<span class="tag" style="color:#478cbf">C</span>' : '');
      el.innerHTML = `${childTag} ${def.icon} ${n.id} ${playTag}${hasScript}`;
      el.onclick = (e)=>{ e.stopPropagation(); this.select(n.id); };
      let timer=null;
      const start = ()=>{ timer=setTimeout(()=>this.confirmDeleteNode(n.id),600); };
      const cancel = ()=>{ if(timer) clearTimeout(timer); };
      el.addEventListener('touchstart', start);
      el.addEventListener('touchend', cancel);
      el.addEventListener('mousedown', start);
      el.addEventListener('mouseup', cancel);
      list.appendChild(el);
      for(const cid of n.children) renderNode(cid, depth+1);
    };
    for(const rid of this.scene.roots) renderNode(rid, 0);
  },
  confirmDeleteNode(id){
    if(!confirm('Удалить узел ' + id + '?')) return;
    this.scene.remove(id);
    if(this.selected === id) this.select(null);
    this.refreshHier(); this.fillInspector(); this.draw();
  },
  addChild(){
    if(!this.selected){ alert('Выбери родителя'); return; }
    const types = Object.keys(NODE_TYPES).join('/');
    const type = prompt('Тип:\n' + types, 'wheelbody2d');
    if(!type || !NODE_TYPES[type]){ alert('Неизвестный тип'); return; }
    const parent = this.scene.find(this.selected);
    const n = this.scene.add(type, parent.x, parent.y, this.selected);
    this.select(n.id); this.draw();
  },

  fillInspector(){
    const empty = document.getElementById('insp-empty');
    const fields = document.getElementById('insp-fields');
    const n = this.selected ? this.scene.find(this.selected) : null;
    if(!n){ empty.style.display='block'; fields.style.display='none'; return; }
    empty.style.display='none'; fields.style.display='block';
    const isUI = n.isUI();
    const hasTex = n.texture ? `<img src="${n.texture}" style="width:100%;height:50px;object-fit:contain;background:#1d1f23;border:1px solid #3a3f47;border-radius:3px;margin-top:3px">` : '<div style="width:100%;height:50px;display:flex;align-items:center;justify-content:center;color:#5a5f66;font-size:11px;background:#1d1f23;border:1px dashed #3a3f47;border-radius:3px;margin-top:3px">нет</div>';
    const hasScripts = n.onUpdate || n.onPress || n.onRelease || n.onStart;
    const isPlayer = n.type==='player';
    const isVehicle = n.type==='vehiclebody2d';
    const isWheel = n.type==='wheelbody2d';
    const isCamera = n.type==='camera2d';
    const isInfinite = n.type==='infinitemap';

    let html = `
      <div class="prop"><label>ID / Тип</label><input readonly value="${n.id} / ${n.type}"></div>
      <div class="prop"><label>X</label><input type="number" id="iX" value="${n.x}"></div>
      <div class="prop"><label>Y</label><input type="number" id="iY" value="${n.y}"></div>
      <div class="prop"><label>W</label><input type="number" id="iW" value="${n.w}"></div>
      <div class="prop"><label>H</label><input type="number" id="iH" value="${n.h}"></div>
    `;
    if(isPlayer){
      html += `
        <div class="prop"><label>Скорость</label><input type="number" id="iSpeed" value="${n.speed||220}"></div>
        <div class="prop"><label>Прыжок</label><input type="number" id="iJump" value="${n.jumpForce||420}"></div>
      `;
    }
    if(isVehicle){
      html += `
        <div class="prop"><label>Сила двигателя</label><input type="number" id="iEngine" value="${n.engineForce||300}"></div>
        <div class="prop"><label>Скорость поворота</label><input type="number" step="0.1" id="iTurn" value="${n.turnSpeed||2}"></div>
      `;
    }
    if(isWheel){
      html += `
        <div class="prop"><label>Радиус</label><input type="number" id="iRadius" value="${n.radius||10}"></div>
        <div class="prop"><label>Управляемое</label><input type="checkbox" id="iSteer" ${n.steerable?'checked':''}></div>
      `;
    }
    if(isCamera){
      html += `
        <div class="prop"><label>Follow ID (узел)</label><input type="text" id="iFollow" value="${n.followId||''}" placeholder="n1, n5..."></div>
        <div class="prop"><label>Zoom</label><input type="number" step="0.1" id="iZoom" value="${n.zoom||1}"></div>
        <div class="prop"><label>Сглаживание 0..1</label><input type="number" step="0.05" id="iSmooth" value="${n.smooth||0.1}"></div>
      `;
    }
    if(isInfinite){
      html += `
        <div class="prop"><label>Цвет плитки</label><input type="color" id="iTile" value="${n.tileColor||'#0d0f12'}"></div>
        <div class="prop"><label>Цвет сетки</label><input type="color" id="iGrid" value="${n.gridColor||'#1a1d21'}"></div>
        <div class="prop"><label>Вкл. бесконечность (сцена)</label><input type="checkbox" id="iInf ${''}" ${this.scene.infinite?'checked':''} style="width:auto"></div>
      `;
    }
    if(isUI){
      html += `
        <div class="prop"><label>Текст</label><input type="text" id="iText" value="${(n.text||'').replace(/"/g,'&quot;')}"></div>
        <div class="prop"><label>Шрифт</label>
          <select id="iFont">${FONTS.map(f=>`<option value="${f}" ${n.fontFamily===f?'selected':''}>${f}</option>`).join('')}</select>
        </div>
        <div class="prop"><label>Размер</label><input type="number" id="iFS" value="${n.fontSize}"></div>
        <div class="prop"><label>Цвет текста</label><input type="color" id="iTC" value="${n.textColor}"></div>
        <div class="prop"><label>Прозрачный фон</label><input type="checkbox" id="iNoBg" ${n.bgTransparent?'checked':''}></div>
      `;
      if(n.type==='button'){
        html += `<div class="prop"><label>Фон</label><input type="color" id="iBG" value="${n.bgColor}"></div>`;
        html += `<div class="prop"><label>Действие</label>
          <select id="iAction">
            <option value="">— нет —</option>
            ${Object.keys(this.inputMap).map(a=>`<option value="${a}" ${n.action===a?'selected':''}>${a}</option>`).join('')}
          </select></div>`;
      }
    }
    html += `
      <div class="prop"><label>Текстура</label>${hasTex}
        <div class="row2">
          <button class="btn small" id="iTexLoad" style="flex:1">📷 Загрузить</button>
          ${n.texture?'<button class="btn small danger" id="iTexClear">✕</button>':''}
        </div>
      </div>
      <div class="prop"><label>Цвет</label><input type="color" id="iC" value="${n.color||'#478cbf'}"></div>
      <div class="prop">
        <label>Скрипты ${hasScripts?'<span style="color:#e3b341">⚡</span>':''}</label>
        <button class="btn primary small" id="iScripts" style="width:100%">📜 Редактировать</button>
      </div>
    `;
    fields.innerHTML = html;

    const set = (id, key, num)=>{
      const el = document.getElementById(id); if(!el) return;
      el.addEventListener('input', ev=>{
        let v = ev.target.value;
        if(num) v = parseFloat(v)||0;
        n[key] = v;
        if((key==='w'||key==='h') && n.isRound()) n.r = Math.max(n.w,n.h)/2;
        this.draw();
      });
    };
    set('iX','x',true); set('iY','y',true);
    set('iW','w',true); set('iH','h',true);
    set('iC','color',false);
    set('iSpeed','speed',true); set('iJump','jumpForce',true);
    set('iText','text',false); set('iFS','fontSize',true);
    set('iTC','textColor',false); set('iBG','bgColor',false);
    set('iEngine','engineForce',true); set('iTurn','turnSpeed',true);
    set('iRadius','radius',true);
    set('iFollow','followId',false);
    set('iZoom','zoom',true); set('iSmooth','smooth',true);
    set('iTile','tileColor',false); set('iGrid','gridColor',false);

    const steerCb = document.getElementById('iSteer');
    if(steerCb) steerCb.addEventListener('change', ev=>{ n.steerable = ev.target.checked; });
    const noBgCb = document.getElementById('iNoBg');
    if(noBgCb) noBgCb.addEventListener('change', ev=>{ n.bgTransparent = ev.target.checked; this.draw(); });
    const fontSel = document.getElementById('iFont');
    if(fontSel) fontSel.addEventListener('change', ev=>{ n.fontFamily = ev.target.value; this.draw(); });
    const actSel = document.getElementById('iAction');
    if(actSel) actSel.addEventListener('change', ev=>{ n.action = ev.target.value; });
    const infCb = document.getElementById('iInf');
    if(infCb) infCb.addEventListener('change', ev=>{ this.scene.infinite = ev.target.checked; this.draw(); });

    const texBtn = document.getElementById('iTexLoad');
    if(texBtn) texBtn.onclick = ()=>{
      document.getElementById('texInput').onchange = (ev)=>{
        const f = ev.target.files[0]; if(!f) return;
        const r = new FileReader();
        r.onload = ()=>{ n.texture = r.result; this.fillInspector(); this.draw(); document.getElementById('texInput').value=''; };
        r.readAsDataURL(f);
      };
      document.getElementById('texInput').click();
    };
    const clr = document.getElementById('iTexClear');
    if(clr) clr.onclick = ()=>{ n.texture = null; this.fillInspector(); this.draw(); };
    document.getElementById('iScripts').onclick = ()=> this.openNodeScriptEditor(n);
  },

  openNodeScriptEditor(node){
    const title = document.getElementById('scriptTitle');
    const hint = document.getElementById('scriptHint');
    const ta = document.getElementById('script');
    const tplBtn = document.getElementById('tplBtn');
    const relBtn = document.getElementById('relBtn');
    title.textContent = 'Скрипт ' + node.id + ' (' + node.type + ')';
    hint.innerHTML = '<b>self</b> — узел, <b>game</b> — API, <b>dt</b> — время кадра<br>onStart / onUpdate / onPress / onRelease';
    ta.value = node.onUpdate;
    ta.dataset.mode = 'update';
    relBtn.style.display = 'inline-block';
    relBtn.textContent = '⏏ onPress';
    relBtn.onclick = ()=>{
      if(ta.dataset.mode === 'update'){ node.onUpdate = ta.value; ta.value = node.onPress; ta.dataset.mode = 'press'; relBtn.textContent = '⏏ onRelease'; }
      else if(ta.dataset.mode === 'press'){ node.onPress = ta.value; ta.value = node.onRelease; ta.dataset.mode = 'release'; relBtn.textContent = '⏏ onStart'; }
      else if(ta.dataset.mode === 'release'){ node.onRelease = ta.value; ta.value = node.onStart; ta.dataset.mode = 'start'; relBtn.textContent = '⏏ onUpdate'; }
      else { node.onStart = ta.value; ta.value = node.onUpdate; ta.dataset.mode = 'update'; relBtn.textContent = '⏏ onPress'; }
    };
    tplBtn.style.display = 'inline-block';
    tplBtn.onclick = ()=>{ ta.value = getTemplate(node.type); };
    document.getElementById('modal').classList.add('show');
    document.getElementById('scriptSave').onclick = ()=>{
      if(ta.dataset.mode==='update') node.onUpdate = ta.value;
      else if(ta.dataset.mode==='press') node.onPress = ta.value;
      else if(ta.dataset.mode==='release') node.onRelease = ta.value;
      else node.onStart = ta.value;
      document.getElementById('modal').classList.remove('show');
      this.refreshHier(); this.fillInspector();
    };
    document.getElementById('scriptCancel').onclick = ()=>{
      document.getElementById('modal').classList.remove('show');
    };
  },

  draw(){
    if(!this.ctx) return;
    const ctx = this.ctx;
    ctx.clearRect(0,0,W,H);
    // бесконечная карта
    if(this.scene.infinite){
      this.drawInfiniteMap(ctx, 0, 0, W, H);
    } else {
      ctx.fillStyle = this.scene.bgColor || '#0d0f12';
      ctx.fillRect(0,0,W,H);
    }
    if(this.settings.grid){
      ctx.strokeStyle='#1a1d21'; ctx.lineWidth=1;
      for(let x=0;x<=W;x+=20){ ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,H); ctx.stroke(); }
      for(let y=0;y<=H;y+=20){ ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke(); }
    }
    const sorted = [...this.scene.nodes].sort((a,b)=>(a.layerOrder||0)-(b.layerOrder||0));
    for(const n of sorted){
      if(!n.visible) continue;
      this.drawNode(ctx, n);
      if(this.mode==='edit' && n.id===this.selected && !n.isBackground()){
        ctx.strokeStyle='#478cbf'; ctx.lineWidth=2; ctx.setLineDash([4,4]);
        if(n.isRound()){ ctx.beginPath(); ctx.arc(n.x,n.y,n.r+4,0,Math.PI*2); ctx.stroke(); }
        else { ctx.strokeRect(n.left-3,n.top-3,n.w+6,n.h+6); }
        ctx.setLineDash([]);
      }
    }
  },

  drawInfiniteMap(ctx, camX, camY, viewW, viewH){
    // рисуем тайлы на основе камеры
    const tile = WORLD_TILE;
    const startTileX = Math.floor(camX / tile);
    const startTileY = Math.floor(camY / tile);
    const endTileX = Math.ceil((camX + viewW) / tile);
    const endTileY = Math.ceil((camY + viewH) / tile);
    for(let tx = startTileX; tx <= endTileX; tx++){
      for(let ty = startTileY; ty <= endTileY; ty++){
        const sx = tx * tile - camX;
        const sy = ty * tile - camY;
        // шахматный цвет
        const isDark = (tx + ty) % 2 === 0;
        ctx.fillStyle = isDark ? '#0a0c0f' : '#0d0f12';
        ctx.fillRect(sx, sy, tile, tile);
        // границы тайлов
        ctx.strokeStyle = '#1a1d21';
        ctx.lineWidth = 1;
        ctx.strokeRect(sx+0.5, sy+0.5, tile-1, tile-1);
      }
    }
  },

  drawNode(ctx, n){
    if(n.texture){
      if(!n._img || n._img.src !== n.texture){
        n._img = new Image(); n._img.src = n.texture;
      }
      if(n._img.complete && n._img.naturalWidth>0){
        try {
          if(n.isRound()){
            ctx.save();
            ctx.beginPath(); ctx.arc(n.x,n.y,n.r,0,Math.PI*2); ctx.clip();
            ctx.drawImage(n._img, n.x-n.r, n.y-n.r, n.r*2, n.r*2);
            ctx.restore();
          } else {
            ctx.drawImage(n._img, n.left, n.top, n.w, n.h);
          }
        } catch(e){}
      }
    } else if(n.isRound()){
      ctx.beginPath(); ctx.arc(n.x,n.y,n.r,0,Math.PI*2);
      ctx.fillStyle = n.color; ctx.fill();
    } else if(n.type==='camera2d'){
      // камера — крестик
      ctx.strokeStyle = '#478cbf'; ctx.lineWidth = 2;
      ctx.strokeRect(n.x-15, n.y-10, 30, 20);
      ctx.beginPath();
      ctx.moveTo(n.x-15, n.y); ctx.lineTo(n.x-25, n.y-8);
      ctx.moveTo(n.x-15, n.y); ctx.lineTo(n.x-25, n.y+8);
      ctx.stroke();
      // линия к follow
      if(n.followId){
        const target = this.scene.find(n.followId);
        if(target){
          ctx.strokeStyle = '#478cbf66'; ctx.lineWidth = 1; ctx.setLineDash([3,3]);
          ctx.beginPath(); ctx.moveTo(n.x, n.y); ctx.lineTo(target.x, target.y); ctx.stroke();
          ctx.setLineDash([]);
        }
      }
    } else if(n.isVehicle()){
      // кузов
      ctx.fillStyle = n.color;
      ctx.fillRect(n.left, n.top, n.w, n.h);
      ctx.strokeStyle = '#0006'; ctx.lineWidth = 1;
      ctx.strokeRect(n.left, n.top, n.w, n.h);
      // фары
      ctx.fillStyle = '#e3b341';
      ctx.beginPath(); ctx.arc(n.right-6, n.y-8, 3, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(n.right-6, n.y+8, 3, 0, Math.PI*2); ctx.fill();
    } else if(n.type!=='sprite' && n.type!=='infinitemap' && n.type!=='canvaslayer' && !n.isUI()) {
      ctx.fillStyle = n.color;
      ctx.fillRect(n.left,n.top,n.w,n.h);
      if(n.type==='player'){
        ctx.fillStyle='#000';
        ctx.beginPath(); ctx.arc(n.x-5,n.y-6,3,0,Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.arc(n.x+5,n.y-6,3,0,Math.PI*2); ctx.fill();
      }
      if(n.type==='enemy'){
        ctx.fillStyle='#000';
        ctx.fillRect(n.x-7,n.y-5,4,4);
        ctx.fillRect(n.x+3,n.y-5,4,4);
      }
    }
    if(n.type==='button' && !n.bgTransparent){
      ctx.fillStyle = n.bgColor || '#478cbf';
      this.roundRect(ctx, n.left, n.top, n.w, n.h, 6);
      ctx.fill();
    }
    if(n.type==='toggle'){
      ctx.fillStyle = n.value ? '#478c47' : '#3a3f47';
      this.roundRect(ctx, n.left, n.top, n.w, n.h, n.h/2);
      ctx.fill();
      const cx = n.value ? n.right - n.h/2 : n.left + n.h/2;
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.arc(cx, n.y, n.h/2 - 4, 0, Math.PI*2); ctx.fill();
    }
    if(n.type==='slider'){
      ctx.fillStyle = '#3a3f47';
      this.roundRect(ctx, n.left, n.y - 4, n.w, 8, 4);
      ctx.fill();
      ctx.fillStyle = '#478cbf';
      this.roundRect(ctx, n.left, n.y - 4, n.w * (n.value||0), 8, 4);
      ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.arc(n.left + n.w * (n.value||0), n.y, 10, 0, Math.PI*2);
      ctx.fill();
    }
    if(n.isUI() || n.type==='npc'){
      ctx.fillStyle = n.textColor || '#fff';
      ctx.font = `bold ${n.fontSize||14}px ${n.fontFamily||'system-ui'},sans-serif`;
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(n.text || '', n.x, n.y);
    }
  },
  roundRect(ctx, x, y, w, h, r){
    ctx.beginPath();
    ctx.moveTo(x+r, y);
    ctx.lineTo(x+w-r, y); ctx.quadraticCurveTo(x+w, y, x+w, y+r);
    ctx.lineTo(x+w, y+h-r); ctx.quadraticCurveTo(x+w, y+h, x+w-r, y+h);
    ctx.lineTo(x+r, y+h); ctx.quadraticCurveTo(x, y+h, x, y+h-r);
    ctx.lineTo(x, y+r); ctx.quadraticCurveTo(x, y, x+r, y);
    ctx.closePath();
  },
  startRender(){
    const loop = ()=>{ if(this.mode==='edit') this.draw(); requestAnimationFrame(loop); };
    loop();
  },

  async play(){
    this._originalScenes = this.scenes;
    this._originalCurrent = this.currentScene;
    this.scenes = this.scenes.map(s => this.cloneScene(s));
    const startIdx = this.scenes.findIndex(s=>s.name.toLowerCase().includes('меню'));
    const idx = startIdx >= 0 ? startIdx : 0;
    await this.enterFullscreen();
    this.showGameScreen();
    await this.runScene(idx);
  },
  async enterFullscreen(){
    try {
      const el = document.documentElement;
      if(el.requestFullscreen) await el.requestFullscreen({ navigationUI: 'hide' });
      else if(el.webkitRequestFullscreen) el.webkitRequestFullscreen();
    } catch(e){}
    this.resizeGameCanvas();
    window.addEventListener('resize', ()=>this.resizeGameCanvas());
    window.addEventListener('orientationchange', ()=>{ setTimeout(()=>this.resizeGameCanvas(), 300); });
  },
  exitFullscreen(){
    try {
      if(document.fullscreenElement) document.exitFullscreen();
      else if(document.webkitFullscreenElement) document.webkitExitFullscreen();
    } catch(e){}
  },
  resizeGameCanvas(){
    const canvas = this.gameCanvas;
    const view = document.getElementById('game-view');
    if(!canvas || !view) return;
    const vw = view.clientWidth, vh = view.clientHeight;
    const size = Math.min(vw, vh);
    canvas.style.width = size + 'px';
    canvas.style.height = size + 'px';
    canvas.width = W; canvas.height = H;
    canvas.style.position = 'absolute';
    canvas.style.left = ((vw - size) / 2) + 'px';
    canvas.style.top  = ((vh - size) / 2) + 'px';
  },
  showGameScreen(){
    document.querySelectorAll('.screen').forEach(s=>s.classList.remove('show'));
    document.getElementById('game-screen').classList.add('show');
    this.mode = 'play';
    setTimeout(()=>this.resizeGameCanvas(), 30);
    setTimeout(()=>this.resizeGameCanvas(), 150);
    setTimeout(()=>this.resizeGameCanvas(), 400);
  },
  stop(){
    this.mode = 'edit';
    if(this.gameRaf) cancelAnimationFrame(this.gameRaf);
    this.gameRaf = null;
    if(this._originalScenes){
      this.scenes = this._originalScenes;
      this.currentScene = this._originalCurrent;
      this._originalScenes = null;
    }
    document.getElementById('game-screen').classList.remove('show');
    this.exitFullscreen();
    document.querySelectorAll('.screen').forEach(s=>s.classList.remove('show'));
    document.getElementById('editor').classList.add('show');
    this.refreshSceneTabs(); this.refreshHier(); this.fillInspector();
    setTimeout(()=>this.draw(), 50);
  },

  async changeScene(sceneName){
    const idx = this.scenes.findIndex(s=>s.name === sceneName);
    if(idx < 0){ console.warn('Сцена не найдена:', sceneName); return; }
    await this.runScene(idx);
  },

  async runScene(idx){
    if(this.gameRaf) cancelAnimationFrame(this.gameRaf);
    this.gameRaf = null;
    this.currentScene = idx;
    this.refreshSceneTabs();
    const scene = this.scenes[idx];
    this.gameState = { scene: scene, running: true, compiledUpdate: null, compiledNodeUpdates: {} };
    try {
      if(scene.onStart && scene.onStart.trim()){
        const fn = new Function('scene','game', scene.onStart);
        fn.call(null, scene, this.getGameAPI());
      }
    } catch(e){ console.error('scene.onStart:', e); }
    for(const n of scene.nodes){
      n.data = {};
      if(n.onStart && n.onStart.trim()){
        try { const fn = new Function('self','game', n.onStart); fn.call(null, n, this.getGameAPI()); }
        catch(e){ console.error('node.onStart', n.id, e); }
      }
      if(n.onUpdate && n.onUpdate.trim()){
        try { this.gameState.compiledNodeUpdates[n.id] = new Function('self','game','dt', n.onUpdate); }
        catch(e){ console.error('node.onUpdate', n.id, e); }
      }
    }
    try {
      if(scene.onUpdate && scene.onUpdate.trim()){
        this.gameState.compiledUpdate = new Function('scene','game','dt', scene.onUpdate);
      }
    } catch(e){ console.error('scene.onUpdate:', e); }
    for(const n of scene.nodes){ n.vx = 0; n.vy = 0; n.onGround = false; }
    // инициализируем камеру
    const cam = scene.camera;
    if(cam){
      const target = cam.followId ? scene.find(cam.followId) : scene.player;
      if(target){ this.camera.x = target.x - W/2; this.camera.y = target.y - H/2; }
    } else {
      this.camera.x = 0; this.camera.y = 0;
    }
    this.bindGameInput();
    this.lastT = performance.now();
    this.resizeGameCanvas();
    this.gameLoop();
  },

  getGameAPI(){
    const self = this;
    return {
      changeScene: (n)=> self.changeScene(n),
      stop: ()=> self.stop(),
      get scene(){ return self.gameState ? self.gameState.scene : null; },
      get nodes(){ return self.gameState ? self.gameState.scene.nodes : []; },
      find: (id)=> self.gameState ? self.gameState.scene.find(id) : null,
      get inputMap(){ return self.inputMap; },
      isActionPressed: (a)=> self.isActionPressed(a),
      isTouchPressed: (a)=> !!self.touchActions[a],
      get touchX(){ return self.touchX; },
      get camera(){ return self.camera; },
      setCamera: (x,y)=>{ self.camera.x = x; self.camera.y = y; }
    };
  },

  bindGameInput(){
    const c = this.gameCanvas;
    if(c._bound) return;
    c._bound = true;
    this.touchActions = {};
    for(const k of Object.keys(this.inputMap)) this.touchActions[k] = false;
    this.touchX = null;
    this.buttonHeld.clear();

    const findButtonAt = (p)=>{
      if(!this.gameState) return null;
      const sorted = [...this.gameState.scene.nodes].sort((a,b)=>(b.layerOrder||0)-(a.layerOrder||0));
      for(const n of sorted){
        if(!n.visible) continue;
        if(n.type !== 'button' && n.type !== 'toggle' && n.type !== 'slider') continue;
        // для UI координаты без камеры
        const isUI = n.isUI();
        const px = isUI ? p.x : p.x;
        const py = isUI ? p.y : p.y;
        if(px>=n.left && px<=n.right && py>=n.top && py<=n.bottom) return n;
      }
      return null;
    };

    const press = (cx, cy)=>{
      if(this.mode!=='play' || !this.gameState) return;
      const p = this.toWorld(cx, cy, c, this.gameState.scene);
      const btn = findButtonAt(p);
      if(btn){
        if(btn.type==='toggle'){ btn.value = btn.value ? 0 : 1; this.triggerButton(btn, 'onPress'); return; }
        if(btn.type==='slider'){ btn.value = Math.max(0, Math.min(1, (p.x - btn.left) / btn.w)); this.buttonHeld.add(btn.id); this.triggerButton(btn, 'onPress'); return; }
        this.triggerButton(btn, 'onPress');
        if(btn.action){ this.touchActions[btn.action] = true; }
        this.buttonHeld.add(btn.id);
        return;
      }
      const player = this.gameState.scene.player;
      if(!player) return;
      const dx = p.x - player.x;
      this.touchActions.move_left  = dx < -15;
      this.touchActions.move_right = dx >  15;
      this.touchActions.jump       = p.y < H * 0.35;
      this.touchX = p.x;
    };

    const move = (cx, cy)=>{
      if(this.mode!=='play' || !this.gameState) return;
      const p = this.toWorld(cx, cy, c, this.gameState.scene);
      for(const id of this.buttonHeld){
        const n = this.gameState.scene.find(id);
        if(n && n.type==='slider') n.value = Math.max(0, Math.min(1, (p.x - n.left) / n.w));
      }
      for(const id of [...this.buttonHeld]){
        const n = this.gameState.scene.find(id);
        if(!n){ this.buttonHeld.delete(id); continue; }
        if(n.type==='slider') continue;
        if(!(p.x>=n.left && p.x<=n.right && p.y>=n.top && p.y<=n.bottom)){
          if(n.action) this.touchActions[n.action] = false;
          this.buttonHeld.delete(id);
        }
      }
      if(this.buttonHeld.size === 0){
        const player = this.gameState.scene.player;
        if(!player) return;
        const dx = p.x - player.x;
        this.touchActions.move_left  = dx < -15;
        this.touchActions.move_right = dx >  15;
        this.touchActions.jump       = p.y < H * 0.35;
        this.touchX = p.x;
      }
    };

    const release = ()=>{
      if(this.gameState){
        for(const n of this.gameState.scene.nodes){
          if(n.onRelease && n.onRelease.trim()) this.triggerButton(n, 'onRelease');
        }
      }
      for(const id of this.buttonHeld){
        const n = this.gameState.scene.find(id);
        if(n && n.action) this.touchActions[n.action] = false;
      }
      this.buttonHeld.clear();
      for(const k of Object.keys(this.touchActions)) this.touchActions[k] = false;
      this.touchX = null;
    };

    c.addEventListener('pointerdown', e=>{ e.preventDefault(); press(e.clientX, e.clientY); }, {passive:false});
    c.addEventListener('pointermove', e=>{ if(this.mode!=='play') return; e.preventDefault(); move(e.clientX, e.clientY); }, {passive:false});
    c.addEventListener('pointerup', ()=>release());
    c.addEventListener('pointercancel', ()=>release());
    c.addEventListener('contextmenu', e=>e.preventDefault());
  },

  triggerButton(btn, event){
    try {
      const code = btn[event];
      if(code && code.trim()){
        const fn = new Function('self','game', code);
        fn.call(null, btn, this.getGameAPI());
      }
    } catch(e){ console.error('button.'+event, btn.id, e); }
  },

  gameLoop(){
    if(this.mode!=='play' || !this.gameState || !this.gameState.running) return;
    const now = performance.now();
    const dt = Math.min(0.033, (now-this.lastT)/1000);
    this.lastT = now;
    const scene = this.gameState.scene;
    const game = this.getGameAPI();

    if(this.gameState.compiledUpdate){
      try { this.gameState.compiledUpdate.call(null, scene, game, dt); }
      catch(e){ console.error('scene.onUpdate:', e); }
    }
    for(const n of scene.nodes){
      const fn = this.gameState.compiledNodeUpdates[n.id];
      if(fn){ try { fn.call(null, n, game, dt); } catch(e){ console.error('node.onUpdate', n.id, e); } }
    }
    // физика
    this.physicsStep(scene, dt);
    // vehicle + wheels
    this.vehicleStep(scene, dt);
    // камера
    this.cameraStep(scene, dt);
    // отрисовка
    this.drawGame(scene);
    this.gameRaf = requestAnimationFrame(()=>this.gameLoop());
  },

  physicsStep(scene, dt){
    const G = this.settings.gravity;
    for(const n of scene.nodes){
      if(!n.dynamic) continue;
      n.vy += G*dt;
      n.x += (n.vx||0)*dt;
      n.y += n.vy*dt;
      n.onGround = false;
    }
    for(const n of scene.nodes){
      if(!n.dynamic) continue;
      for(const o of scene.nodes){
        if(o===n || !o.solid || !o.visible || o.isBackground() || o.isUI() || o.isCamera() || o.isVehicle()) continue;
        if(this.aabb(n,o)){
          if(n.vx>0) n.x = o.left - n.w/2;
          else if(n.vx<0) n.x = o.right + n.w/2;
          n.vx = 0;
        }
      }
      for(const o of scene.nodes){
        if(o===n || !o.solid || !o.visible || o.isBackground() || o.isUI() || o.isCamera() || o.isVehicle()) continue;
        if(this.aabb(n,o)){
          if(n.vy>0){ n.y = o.top - n.h/2; n.vy = 0; n.onGround = true; }
          else if(n.vy<0){ n.y = o.bottom + n.h/2; n.vy = 0; }
        }
      }
      // границы — только если НЕ бесконечная карта
      if(!scene.infinite){
        if(n.left<0){ n.x=n.w/2; n.vx=0; }
        if(n.right>W){ n.x=W-n.w/2; n.vx=0; }
        if(n.top<0){ n.y=n.h/2; n.vy=0; }
        if(n.bottom>H){ n.y=H-n.h/2; n.vy=0; n.onGround=true; }
      }
    }
  },

  vehicleStep(scene, dt){
    const G = this.settings.gravity;
    for(const v of scene.nodes){
      if(!v.isVehicle()) continue;
      // управление
      const gas = this.isActionPressed('car_gas') || this.touchActions.car_gas;
      const brake = this.isActionPressed('car_brake') || this.touchActions.car_brake;
      const left = this.isActionPressed('car_left') || this.touchActions.car_left;
      const right = this.isActionPressed('car_right') || this.touchActions.car_right;

      // ускорение по X
      if(gas) v.vx += (v.engineForce||300) * dt;
      if(brake) v.vx -= (v.engineForce||300) * dt * 0.7;
      v.vx *= 0.98; // трение
      // поворот
      if(left) v.angle -= (v.turnSpeed||2) * dt;
      if(right) v.angle += (v.turnSpeed||2) * dt;

      v.x += v.vx * dt;
      v.y += v.vy * dt;
      v.vy += G*dt*0.3; // лёгкая гравитация
      v.onGround = false;

      // коллизии кузова
      for(const o of scene.nodes){
        if(o===v || !o.solid || !o.visible || o.isBackground() || o.isUI() || o.isCamera()) continue;
        if(o.isWheel()) continue;
        if(this.aabb(v,o)){
          if(v.vx>0) v.x = o.left - v.w/2;
          else if(v.vx<0) v.x = o.right + v.w/2;
          v.vx = 0;
        }
      }
      for(const o of scene.nodes){
        if(o===v || !o.solid || !o.visible || o.isBackground() || o.isUI() || o.isCamera()) continue;
        if(o.isWheel()) continue;
        if(this.aabb(v,o)){
          if(v.vy>0){ v.y = o.top - v.h/2; v.vy = 0; v.onGround = true; }
          else if(v.vy<0){ v.y = o.bottom + v.h/2; v.vy = 0; }
        }
      }
      if(!scene.infinite){
        if(v.left<0) v.x = v.w/2;
        if(v.right>W) v.x = W-v.w/2;
      }

      // обновляем колёса
      const wheels = scene.nodes.filter(n => n.parentId === v.id && n.isWheel());
      const wheelOffsets = [
        { x: -v.w/2 + 10, y:  v.h/2 }, // заднее
        { x:  v.w/2 - 10, y:  v.h/2 }  // переднее
      ];
      wheels.forEach((w, i)=>{
        const off = wheelOffsets[i] || wheelOffsets[0];
        const cos = Math.cos(v.angle), sin = Math.sin(v.angle);
        w.x = v.x + off.x*cos - off.y*sin;
        w.y = v.y + off.x*sin + off.y*cos;
        // колесо катится
        w.angularVel = v.vx / (w.radius||10);
      });
    }
  },

  cameraStep(scene, dt){
    const cam = scene.camera;
    if(!cam) return;
    let target = null;
    if(cam.followId){
      target = scene.find(cam.followId);
    } else {
      target = scene.player;
    }
    if(!target) return;
    const targetX = target.x - W/2;
    const targetY = target.y - H/2;
    const smooth = cam.smooth !== undefined ? cam.smooth : 0.1;
    this.camera.x += (targetX - this.camera.x) * smooth;
    this.camera.y += (targetY - this.camera.y) * smooth;
    this.camera.zoom = cam.zoom || 1;
  },

  aabb(a,b){
    if(a.isRound() && b.isRound()) return Math.hypot(a.x-b.x, a.y-b.y) < (a.r+b.r);
    return !(a.right<b.left || a.left>b.right || a.bottom<b.top || a.top>b.bottom);
  },

  drawGame(scene){
    const ctx = this.gameCtx;
    ctx.clearRect(0,0,W,H);
    ctx.save();
    // применяем камеру
    ctx.translate(-this.camera.x, -this.camera.y);
    // бесконечная карта
    if(scene.infinite){
      this.drawInfiniteMap(ctx, this.camera.x, this.camera.y, W, H);
    } else {
      ctx.fillStyle = scene.bgColor || '#0d0f12';
      ctx.fillRect(0,0,W,H);
    }
    if(this.settings.grid){
      ctx.strokeStyle='#1a1d21'; ctx.lineWidth=1;
      const startX = Math.floor(this.camera.x/20)*20;
      const startY = Math.floor(this.camera.y/20)*20;
      for(let x=startX;x<=startX+W+20;x+=20){ ctx.beginPath(); ctx.moveTo(x,startY); ctx.lineTo(x,startY+H+20); ctx.stroke(); }
      for(let y=startY;y<=startY+H+20;y+=20){ ctx.beginPath(); ctx.moveTo(startX,y); ctx.lineTo(startX+W+20,y); ctx.stroke(); }
    }
    const sorted = [...scene.nodes].sort((a,b)=>(a.layerOrder||0)-(b.layerOrder||0));
    for(const n of sorted){ if(n.visible) this.drawNode(ctx, n); }
    ctx.restore();
  }
};

function getTemplate(type){
  if(type==='player') return `const speed = (self.speed || 220) * dt;
if (game.isActionPressed('move_left')  || game.isTouchPressed('move_left'))  self.x -= speed;
if (game.isActionPressed('move_right') || game.isTouchPressed('move_right')) self.x += speed;
if ((game.isActionPressed('jump') || game.isTouchPressed('jump')) && self.onGround) {
  self.vy = -(self.jumpForce || 420);
  self.onGround = false;
}`;
  if(type==='enemy') return `const p = game.scene.player;
if (!p) return;
if (self.data.dying) return;
const dx = p.x - self.x;
if (Math.abs(dx) > 20) self.x += Math.sign(dx) * 90 * dt;
const dy = p.y - self.y;
if (dy < -50 && self.onGround && Math.abs(dx) < 120) { self.vy = -420; self.onGround = false; }
if (Math.hypot(self.x-p.x, self.y-p.y) < 30) {
  self.data.dying = true;
  p.x = 200; p.y = 300; p.vx = 0; p.vy = 0;
  setTimeout(()=>{ self.data.dying = false; }, 500);
}`;
  if(type==='vehiclebody2d') return `// Управление через Input Map: car_gas, car_brake, car_left, car_right
// Настройки: engineForce, turnSpeed в инспекторе`;
  if(type==='wheelbody2d') return `// Колесо прикрепляется к родителю VehicleBody2D
// steerable = true для управляемого колеса`;
  if(type==='camera2d') return `// followId = ID узла, за которым следить
// zoom, smooth в инспекторе`;
  if(type==='infinitemap') return `// Сцена автоматически становится бесконечной
// tileColor, gridColor в инспекторе`;
  return '// нет шаблона';
}

/* ============================================================
   PROJECT MANAGER (упрощён)
   ============================================================ */
const ProjectManager = {
  projects: [], current: null,
  init(){ this.loadList(); this.renderList(); },
  loadList(){ try { this.projects = JSON.parse(localStorage.getItem('regod_projects_v3') || '[]'); } catch(e){ this.projects = []; } },
  saveList(){ localStorage.setItem('regod_projects_v3', JSON.stringify(this.projects)); },
  renderList(){
    const list = document.getElementById('projectList');
    if(!list) return;
    list.innerHTML = '';
    if(this.projects.length === 0){
      list.innerHTML = '<div style="color:#8b8f96;text-align:center;padding:20px;font-size:12px">Нет проектов. Нажми «Новый проект»</div>';
      return;
    }
    this.projects.forEach(p=>{
      const el = document.createElement('div');
      el.className = 'project-item';
      el.innerHTML = `<div class="pname">${p.name}</div><div class="pinfo">v${p.version} • ${p.author||'без автора'} • ${(p.data?.scenes?.length||0)} сцен</div>`;
      el.onclick = ()=> this.openProject(p.id);
      list.appendChild(el);
    });
  },
  createProject(name){
    if(!name) return;
    const id = 'proj_' + Date.now();
    const project = {
      id, name, version: '1.0.0', author: '', description: '',
      data: {
        scenes: [{
          name: 'Главное меню', nid: 1, roots: [], nodes: [],
          bgColor: '#0a0e14', onStart: '', onUpdate: '', infinite: false
        }],
        inputMap: JSON.parse(JSON.stringify(DEFAULT_INPUT_MAP)),
        settings: { gravity: 900, grid: true }
      }
    };
    this.projects.push(project);
    this.saveList();
    this.openProject(id);
  },
  openProject(id){
    this.current = this.projects.find(p => p.id === id);
    if(!this.current){ alert('Не найден'); return; }
    this.loadIntoEngine(this.current.data);
    document.getElementById('projName').value = this.current.name;
    document.getElementById('projVersion').value = this.current.version;
    document.getElementById('projAuthor').value = this.current.author;
    document.getElementById('projDesc').value = this.current.description;
    document.querySelectorAll('.screen').forEach(s=>s.classList.remove('show'));
    document.getElementById('projectEditor').classList.add('show');
  },
  loadIntoEngine(data){
    if(!data || !data.scenes) return;
    engine.scenes = data.scenes.map(s=>{
      const sc = new Scene(s.name);
      sc.nid = s.nid || 1;
      sc.onStart = s.onStart || '';
      sc.onUpdate = s.onUpdate || '';
      sc.bgColor = s.bgColor || '#0a0e14';
      sc.infinite = !!s.infinite;
      sc.roots = s.roots || [];
      sc.nodes = (s.nodes || []).map(nd=>{
        const n = new Node(nd.type, nd.id);
        Object.assign(n, nd);
        n._img = null;
        if(!n.data) n.data = {};
        return n;
      });
      return sc;
    });
    engine.currentScene = 0;
    engine.inputMap = data.inputMap || JSON.parse(JSON.stringify(DEFAULT_INPUT_MAP));
    engine.settings = Object.assign({ gravity:900, grid:true }, data.settings || {});
    engine.refreshSceneTabs();
    engine.refreshHier();
    engine.fillInspector();
    engine.draw();
  },
  saveCurrent(){
    if(!this.current) return;
    this.current.name = document.getElementById('projName').value || 'Без названия';
    this.current.version = document.getElementById('projVersion').value || '1.0.0';
    this.current.author = document.getElementById('projAuthor').value || '';
    this.current.description = document.getElementById('projDesc').value || '';
    this.current.data = {
      scenes: engine.scenes.map(s=>({
        name: s.name, nid: s.nid, onStart: s.onStart, onUpdate: s.onUpdate,
        bgColor: s.bgColor, infinite: s.infinite, roots: s.roots,
        nodes: s.nodes.map(n=>{ const c = {...n}; delete c._img; return c; })
      })),
      inputMap: engine.inputMap,
      settings: engine.settings
    };
    this.saveList();
    alert('Сохранено');
  },
  deleteProject(){
    if(!this.current) return;
    if(!confirm('Удалить "' + this.current.name + '"?')) return;
    this.projects = this.projects.filter(p => p.id !== this.current.id);
    this.current = null;
    this.saveList();
    this.renderList();
    document.querySelectorAll('.screen').forEach(s=>s.classList.remove('show'));
    document.getElementById('menu').classList.add('show');
  },
  exportJson(){
    if(!this.current) return;
    this.saveCurrent();
    const blob = new Blob([JSON.stringify(this.current, null, 2)], {type: 'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = (this.current.name || 'project').replace(/\s+/g, '_') + '.regod.json';
    a.click();
    URL.revokeObjectURL(url);
  },
  importProject(data){
    if(!data){ alert('Пустой файл'); return; }
    if(data.name && data.data && data.data.scenes){
      const id = 'proj_' + Date.now();
      this.projects.push({
        id, name: data.name, version: data.version || '1.0.0',
        author: data.author || '', description: data.description || '',
        data: data.data
      });
      this.saveList(); this.renderList();
      alert('Проект "' + data.name + '" импортирован');
      return;
    }
    if(data.name && data.scenes){
      const id = 'proj_' + Date.now();
      this.projects.push({
        id, name: data.name, version: data.version || '1.0.0',
        author: data.author || '', description: data.description || '',
        data: { scenes: data.scenes, inputMap: data.inputMap || DEFAULT_INPUT_MAP, settings: data.settings || { gravity:900, grid:true } }
      });
      this.saveList(); this.renderList();
      alert('Проект "' + data.name + '" импортирован');
      return;
    }
    alert('Неизвестный формат');
  }
};

/* ============================================================
   UI
   ============================================================ */
const $ = id=>document.getElementById(id);
function showScreen(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('show'));
  $(id).classList.add('show');
}

$('mNewProject').onclick = ()=>{
  const name = prompt('Название проекта:', 'Моя игра');
  if(name) ProjectManager.createProject(name);
};
$('mImportProject').onclick = ()=> $('projectImport').click();
$('projectImport').onchange = (ev)=>{
  const f = ev.target.files[0]; if(!f) return;
  const r = new FileReader();
  r.onload = ()=>{ try { ProjectManager.importProject(JSON.parse(r.result)); } catch(e){ alert('Ошибка: '+e.message); } $('projectImport').value=''; };
  r.readAsText(f);
};

$('projSave').onclick = ()=> ProjectManager.saveCurrent();
$('projOpenEditor').onclick = ()=>{ showScreen('editor'); engine.refreshSceneTabs(); engine.refreshHier(); engine.fillInspector(); engine.draw(); };
$('projExportHtml').onclick = ()=> alert('HTML-экспорт доступен в полной версии. Используй .regod.json');
$('projExportZip').onclick = ()=> ProjectManager.exportJson();
$('projDelete').onclick = ()=> ProjectManager.deleteProject();
$('projBack').onclick = ()=>{ showScreen('menu'); ProjectManager.renderList(); };

$('btnPlay').onclick = ()=> engine.play();
$('btnMenu').onclick = ()=>{ engine.stop(); if(ProjectManager.current) ProjectManager.saveCurrent(); showScreen('menu'); ProjectManager.renderList(); };
$('btnProjBack').onclick = ()=>{ engine.stop(); if(ProjectManager.current) ProjectManager.saveCurrent(); ProjectManager.openProject(ProjectManager.current.id); };

document.querySelectorAll('[data-add]').forEach(btn=>{
  btn.onclick = ()=>{
    if(engine.mode!=='edit') return;
    const n = engine.scene.add(btn.dataset.add, 200, 200);
    engine.select(n.id); engine.draw();
  };
});
$('btnAddChild').onclick = ()=> engine.addChild();

function renderInputMapEditor(){
  const list = $('im-list');
  list.innerHTML = '';
  for(const action of Object.keys(engine.inputMap)){
    const box = document.createElement('div');
    box.style.cssText = 'background:#1d1f23;border:1px solid #3a3f47;border-radius:3px;padding:8px;margin-bottom:6px';
    const keysHtml = engine.inputMap[action].map((k,i)=>
      `<span style="background:#2d3138;border:1px solid #3a3f47;border-radius:3px;padding:4px 8px;font-size:11px;font-family:monospace;display:inline-flex;gap:4px;align-items:center;margin:2px">${k}<span style="color:#ff8888;cursor:pointer" data-a="${action}" data-i="${i}">✕</span></span>`
    ).join('');
    box.innerHTML = `
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px">
        <span style="font-weight:600;color:#478cbf;font-size:12px">${action}</span>
        <button class="btn danger small" data-del="${action}">Удалить</button>
      </div>
      <div>${keysHtml}<span style="background:#478cbf;color:#fff;border-radius:3px;padding:4px 8px;font-size:11px;cursor:pointer;display:inline-block;margin:2px" data-addkey="${action}">+ клавиша</span></div>
    `;
    list.appendChild(box);
  }
  list.querySelectorAll('[data-a]').forEach(el=>{
    el.onclick = ()=>{ engine.inputMap[el.dataset.a].splice(+el.dataset.i, 1); renderInputMapEditor(); };
  });
  list.querySelectorAll('[data-del]').forEach(el=>{
    el.onclick = ()=>{ if(confirm('Удалить "'+el.dataset.del+'"?')){ delete engine.inputMap[el.dataset.del]; renderInputMapEditor(); } };
  });
  list.querySelectorAll('[data-addkey]').forEach(el=>{
    el.onclick = ()=>{
      const key = prompt('Код клавиши (KeyA, Space...):', 'Space');
      if(key){ if(!engine.inputMap[el.dataset.addkey]) engine.inputMap[el.dataset.addkey] = []; engine.inputMap[el.dataset.addkey].push(key); renderInputMapEditor(); }
    };
  });
}
$('btnInputMap').onclick = ()=>{ renderInputMapEditor(); $('imModal').style.display='flex'; };
$('imClose').onclick = ()=>{ $('imModal').style.display='none'; };
$('imAddAction').onclick = ()=>{
  const name = $('imNewName').value.trim();
  if(!name){ alert('Введи имя'); return; }
  if(engine.inputMap[name]){ alert('Уже есть'); return; }
  engine.inputMap[name] = [];
  $('imNewName').value = '';
  renderInputMapEditor();
};

engine.init();
ProjectManager.init();
</script>
